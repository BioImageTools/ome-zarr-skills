# Stores that inspect-ome-zarr is tested against.
#
# Add a [[store]] block per dataset. `url` may be a local path, .zip, http(s)://,
# s3:// or gs://. Paths starting with "fixtures/" are generated by
# make_fixtures.py. `expect` lists finding codes that MUST appear; `forbid`
# lists codes that must NOT appear; `facts` are free-text truths a reviewer
# checks against the report (pixel size, channels, known bugs).
#
#   uv run tests/inspect-ome-zarr/run_all.py            # all stores
#   uv run tests/inspect-ome-zarr/run_all.py --only lightsheet

# ---------------------------------------------------------------- your data
[[store]]
id = "lightsheet-aind-488"
url = "s3://aind-open-data/890911_2026-10-31_06-09-21_stitched_2026-11-03_09-13-42/image_tile_fusing/OMEZarr/Ex_488_Em_525.zarr"
modality = "light-sheet (AIND, BigStitcher-Spark fusion)"
facts = [
  "OME-Zarr 0.4, Zarr v2, single channel 488/525, uint16",
  "9 levels, 2x downsampling, 1.8 x 1.8 x 2.0 micrometer at level 0",
  "per-level translations look like level-0 voxels, not micrometer",
]
expect = ["TRANSLATION_IN_VOXELS"]
forbid = ["SCALE_SHAPE_MISMATCH", "LEVEL_MISSING", "UNIT_NONSTANDARD"]

# Add more of your stores here, e.g.:
# [[store]]
# id = "confocal-..."
# url = "/path/to/store.zarr"
# modality = "confocal"
# facts = ["4 channels: DAPI, GFP, ...", "pixel size 0.1 micrometer"]
# expect = []
# forbid = []

# ---------------------------------------------------------------- public
[[store]]
id = "idr-v04-labels"
url = "https://uk1s3.embassy.ebi.ac.uk/idr/zarr/v0.4/idr0062A/6001240.zarr"
modality = "confocal (IDR idr0062A)"
facts = ["OME-Zarr 0.4 image with labels", "2 channels with omero metadata"]
forbid = ["LEVEL_MISSING", "AXES_ORDER"]

[[store]]
id = "idr-v05-labels"
url = "https://uk1s3.embassy.ebi.ac.uk/idr/zarr/v0.5/idr0062A/6001240_labels.zarr"
modality = "confocal (IDR idr0062A, 0.5 conversion)"
facts = ["OME-Zarr 0.5, Zarr v3, with labels"]
forbid = ["LEVEL_MISSING", "VERSION_FORMAT_MISMATCH"]

[[store]]
id = "idr-v04-plate"
url = "https://uk1s3.embassy.ebi.ac.uk/idr/zarr/v0.4/idr0001A/2551.zarr"
modality = "HCS widefield (IDR idr0001A)"
facts = ["OME-Zarr 0.4 plate"]
forbid = ["PLATE_MISSING_WELLS"]

